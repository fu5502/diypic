name: Build iOS IPA

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build App & Extension
        run: |
          xcodebuild clean build \
            -project diypic.xcodeproj \
            -scheme diypic \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ./build/Build/Products/Release-iphoneos/diypic.app Payload/
          zip -r diypic_unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: diypic-unsigned-ipa
          path: diypic_unsigned.ipa
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && format('diypic {0}', github.ref_name) || 'diypic - 最新构建 (Latest Build)' }}
          body: |
            自动编译构建的最新版 diypic 安装包。

            ### 下载与安装方法：
            1. 下载下方的 `diypic_unsigned.ipa`。
            2. 使用 Windows 电脑上的 Sideloadly 或爱思助手，输入普通 Apple ID 自签名安装到 iPhone。
            3. 在 iPhone 进入「设置 -> 通用 -> VPN 与设备管理」信任证书。
          files: diypic_unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
