name: diypic
options:
  bundleIdPrefix: com.fu5502
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: NO

targets:
  diypic:
    type: application
    platform: iOS
    sources:
      - path: diypic
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: diypic
        PRODUCT_BUNDLE_IDENTIFIER: com.fu5502.diypic
        INFOPLIST_FILE: diypic/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: diypic/diypic.entitlements
        GENERATE_INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: diypicBroadcast
        embed: true
    entitlements:
      path: diypic/diypic.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.fu5502.diypic

  diypicBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: diypicBroadcast
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: diypicBroadcast
        PRODUCT_BUNDLE_IDENTIFIER: com.fu5502.diypic.broadcast
        INFOPLIST_FILE: diypicBroadcast/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: diypicBroadcast/diypicBroadcast.entitlements
    frameworks:
      - framework: ReplayKit.framework
      - framework: CoreMedia.framework
      - framework: AVFoundation.framework
      - framework: Accelerate.framework
    entitlements:
      path: diypicBroadcast/diypicBroadcast.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.fu5502.diypic
